<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة ✨</title>
    <style>
        :root {
            --bg-color: #FAF6F0;
            --card-bg: #FFFFFF;
            --primary-gold: #D4AF37;
            --dark-gold: #AA7C11;
            --light-gold: #F3E5AB;
            --text-black: #2C2C2C;
            --text-muted: #666666;
            --border-color: #E8DFD1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-black);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* القلوب والنجوم الطائرة */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 4s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* لوحة المولد */
        #generator-screen {
            max-width: 480px;
            margin: 30px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(170, 124, 17, 0.08);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-black);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #FCFAF7;
            font-size: 13px;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-gold);
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            color: #ffffff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(170, 124, 17, 0.2);
            transition: transform 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            background: #F9F5EC;
            border: 1px dashed var(--primary-gold);
            border-radius: 12px;
            display: none;
            text-align: center;
        }

        /* واجهة الظرف 3D */
        #envelope-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .envelope-card {
            background: #FFFFFF;
            padding: 30px 25px;
            border-radius: 24px;
            border: 2px solid var(--primary-gold);
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20deg); }
            to { opacity: 1; transform: translateY(0); }
        }

        .envelope-icon {
            font-size: 55px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        #main-content {
            display: none;
            max-width: 460px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        /* انيميشن السكرول للكروت */
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.02);
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .counter-item {
            background: #FAF6F0;
            border: 1px solid var(--border-color);
            padding: 10px 5px;
            border-radius: 12px;
        }

        .counter-item span {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: var(--dark-gold);
        }

        .msg-box {
            background: #FCFAF7;
            border-right: 4px solid var(--primary-gold);
            padding: 12px 15px;
            margin-bottom: 12px;
            text-align: right;
            border-radius: 8px;
            border-top: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            line-height: 1.6;
        }

        .media-container img, .media-container video {
            width: 100%;
            border-radius: 14px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        .gold-title {
            color: var(--dark-gold);
            margin-bottom: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 1. لوحة إنشاء الهدية (للأدمن/التاجر) -->
    <div id="generator-screen">
        <h3 class="gold-title" style="text-align: center; margin-bottom: 20px;">✨ مولد هدايا العشاق الاحترافي ✨</h3>
        <div class="form-group"><label>اسم المستلم:</label><input type="text" id="g-name" placeholder="مثال: مريم"></div>
        <div class="form-group"><label>كلمة السر للظرف:</label><input type="text" id="g-pass" placeholder="مثال: بحبك"></div>
        <div class="form-group"><label>تاريخ البداية (للعداد):</label><input type="datetime-local" id="g-date"></div>
        <div class="form-group"><label>الجملة الافتتاحية:</label><input type="text" id="g-intro" placeholder="جملة تظهر أول ما يفتح الهدية"></div>
        <div class="form-group"><label>الرسائل (افصلي بين كل رسالة بشرطة -):</label><textarea id="g-msgs" rows="3" placeholder="الرسالة الأولية - الرسالة الثانية - الرسالة الثالثة"></textarea></div>
        <div class="form-group"><label>رابط الصورة المباشر (من Catbox أو Drive):</label><input type="text" id="g-img" placeholder="https://..."></div>
        <div class="form-group"><label>رابط الأغنية المباشر (MP3):</label><input type="text" id="g-audio" placeholder="https://..."></div>
        <div class="form-group"><label>رابط الفيديو المباشر (MP4):</label><input type="text" id="g-video" placeholder="https://..."></div>
        <button class="btn-gold" onclick="generateLink()">إنشاء الرابط القصير فوراً ✨</button>
        
        <div id="result-box">
            <p style="font-size: 13px; font-weight: bold; color: var(--text-black);">الرابط جاهز للعميل:</p>
            <p id="generated-url" style="color: var(--dark-gold); font-size: 12px; margin: 10px 0; word-break: break-all; font-weight: 600;"></p>
            <button class="btn-gold" onclick="copyUrl()">نسخ الرابط 📋</button>
        </div>
    </div>

    <!-- 2. واجهة الظرف وكلمة السر (للعميل) -->
    <div id="envelope-overlay" style="display:none;">
        <div class="envelope-card">
            <div class="envelope-icon">✉️</div>
            <h3 id="view-envelope-title" class="gold-title"></h3>
            <p style="font-size: 13px; color: var(--text-muted); margin: 10px 0;">ادخلي كلمة السر الخاصة لفتح الهدية 💖</p>
            <input type="password" id="unlock-pass" placeholder="كلمة السر" style="width: 100%; padding: 10px; text-align: center; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 10px; outline: none;">
            <button class="btn-gold" onclick="checkPass()">افتحي الهدية ✨</button>
        </div>
    </div>

    <!-- 3. المحتوى الرئيسي للهدية -->
    <div id="main-content">
        <div class="section-card">
            <h3 id="view-intro" class="gold-title"></h3>
        </div>

        <div class="section-card">
            <h3 class="gold-title">⏳ عداد حكايتنا</h3>
            <div class="counter-grid">
                <div class="counter-item"><span id="y">0</span>سنة</div>
                <div class="counter-item"><span id="m">0</span>شهر</div>
                <div class="counter-item"><span id="d">0</span>يوم</div>
                <div class="counter-item"><span id="h">0</span>ساعة</div>
                <div class="counter-item"><span id="i">0</span>دقيقة</div>
                <div class="counter-item"><span id="s">0</span>ثانية</div>
            </div>
        </div>

        <div class="section-card">
            <h3 class="gold-title" style="margin-bottom: 15px;">💬 رسائل من القلب</h3>
            <div id="view-msgs"></div>
        </div>

        <div class="section-card" id="card-img" style="display:none;">
            <h3 class="gold-title">📸 ذكرياتنا سوا</h3>
            <div id="view-img" class="media-container"></div>
        </div>

        <div class="section-card" id="card-audio" style="display:none;">
            <h3 class="gold-title">🎵 أغنيتنا</h3>
            <audio id="view-audio" controls style="width: 100%; margin-top: 10px;"></audio>
        </div>

        <div class="section-card" id="card-video" style="display:none;">
            <h3 class="gold-title">🎬 فيديو خاص</h3>
            <div class="media-container">
                <video id="view-video" controls></video>
            </div>
        </div>

        <div class="section-card" style="background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold)); color: #ffffff;">
            <h3 id="footer-text" style="color: #fff;"></h3>
            <p style="font-size: 12px; opacity: 0.9; margin-top: 5px;">✨ Made Specially For You ✨</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('d');
        let clientData = null;

        startHearts();

        if (dataParam) {
            document.getElementById('generator-screen').style.display = 'none';
            document.getElementById('envelope-overlay').style.display = 'flex';
            try {
                clientData = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
                document.getElementById('view-envelope-title').innerText = `هدية خاصة لـ ${clientData.n}`;
            } catch (e) {
                console.error("Error decoding data");
            }
        }

        function generateLink() {
            const rawMsgs = document.getElementById('g-msgs').value.split('-').map(m => m.trim()).filter(m => m !== "");
            const data = {
                n: document.getElementById('g-name').value || "مريم",
                p: document.getElementById('g-pass').value || "بحبك",
                dt: document.getElementById('g-date').value,
                it: document.getElementById('g-intro').value || "مش عارف رده فعلك ايه بس يارب تتبسطي",
                m: rawMsgs,
                i: document.getElementById('g-img').value,
                a: document.getElementById('g-audio').value,
                v: document.getElementById('g-video').value
            };

            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const fullUrl = window.location.origin + window.location.pathname + '?d=' + encoded;
            
            document.getElementById('generated-url').innerText = fullUrl;
            document.getElementById('result-box').style.display = 'block';
        }

        function copyUrl() {
            const urlText = document.getElementById('generated-url').innerText;
            navigator.clipboard.writeText(urlText);
            alert("تم نسخ الرابط بنجاح! 🎉");
        }

        function checkPass() {
            const input = document.getElementById('unlock-pass').value;
            if (input === clientData.p) {
                document.getElementById('envelope-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadGift();
            } else {
                alert("كلمة السر خاطئة ❌");
            }
        }

        function loadGift() {
            document.getElementById('view-intro').innerText = clientData.it;
            document.getElementById('footer-text').innerText = `معمولة مخصوص لـ ${clientData.n} ❤️`;
            document.getElementById('view-msgs').innerHTML = clientData.m.map(m => `<div class="msg-box">${m}</div>`).join('');

            if (clientData.i) {
                document.getElementById('card-img').style.display = 'block';
                document.getElementById('view-img').innerHTML = `<img src="${clientData.i}">`;
            }
            if (clientData.a) {
                document.getElementById('card-audio').style.display = 'block';
                document.getElementById('view-audio').src = clientData.a;
            }
            if (clientData.v) {
                document.getElementById('card-video').style.display = 'block';
                document.getElementById('view-video').src = clientData.v;
            }

            if (clientData.dt) {
                const start = new Date(clientData.dt).getTime();
                setInterval(() => {
                    const diff = new Date().getTime() - start;
                    document.getElementById('s').innerText = Math.floor((diff / 1000) % 60);
                    document.getElementById('i').innerText = Math.floor((diff / (1000 * 60)) % 60);
                    document.getElementById('h').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    document.getElementById('d').innerText = Math.floor((diff / (1000 * 60 * 60 * 24)) % 30);
                    document.getElementById('m').innerText = Math.floor((diff / (1000 * 60 * 60 * 24 * 30.4375)) % 12);
                    document.getElementById('y').innerText = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
                }, 1000);
            }

            setTimeout(initScrollObserver, 100);
        }

        function initScrollObserver() {
            const cards = document.querySelectorAll('.section-card');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach(card => observer.observe(card));
        }

        function startHearts() {
            setInterval(() => {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.innerText = ['✨', '💖', '⭐', '💕'][Math.floor(Math.random() * 4)];
                h.style.left = Math.random() * 100 + 'vw';
                h.style.fontSize = (Math.random() * 10 + 14) + 'px';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }, 350);
        }
    </script>
</body>
</html>
